name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.13 / tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Verify dependency reproducibility contract
        run: python -m pytest tests/test_dependency_reproducibility_contract.py -q

      - name: Verify architecture dependency guards
        run: python -m pytest tests/test_architecture_dependencies.py -q

      - name: Run full regression suite
        run: python -m pytest -q

      - name: Check whitespace errors
        run: git diff --check
